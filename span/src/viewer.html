<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory viewer</title>
<style>body{font:1rem system-ui;max-width:60rem;margin:2rem auto;padding:1rem}label{display:block;margin:1rem 0}input{width:100%;padding:.5rem;box-sizing:border-box}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{padding:.6rem}</style>
<h1>Memory viewer</h1>
<p>Read-only search. Credentials remain in this page's memory and are not saved.</p>
<form id="search">
<label>Bearer token <input id="token" type="password" autocomplete="off" required></label>
<label>Exact scope <input id="scope" required></label>
<label>Query <input id="query" required></label>
<button>Search</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<pre id="results"></pre>
<script src="/viewer.js"></script>
</html>
