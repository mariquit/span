[package]
name = "span"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Local persistent semantic memory over MCP Streamable HTTP"
readme = "../README.md"
repository = "https://github.com/mariquit/span"
homepage = "https://github.com/mariquit/span"
keywords = ["mcp", "memory", "semantic-search", "sqlite"]
categories = ["command-line-utilities", "database"]

[features]
default = ["fastembed"]
fastembed = ["span-core/fastembed"]
ann = ["span-core/ann"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
directories.workspace = true
getrandom = "0.4"
libc = "0.2"
span-core = { path = "../span-core" }
rmcp = { version = "3.5.1", features = ["server", "transport-streamable-http-server", "schemars"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tiny_http = "0.12"
axum = "0.8"
sha2.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "span"
path = "src/main.rs"
